<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Link Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #1b0a1d; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #2d1433; padding: 30px; border-radius: 15px; width: 100%; max-width: 550px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ff7eb3; margin-bottom: 10px; }
        p.subtitle { text-align: center; font-size: 0.85rem; color: #fce7f3; margin-bottom: 20px; }
        .section-title { font-size: 0.9rem; color: #ff7eb3; margin-top: 15px; margin-bottom: 10px; text-transform: uppercase; font-weight: 600; border-bottom: 1px solid rgba(255,126,179,0.3); padding-bottom: 5px; }
        label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: #fce7f3; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid rgba(255, 126, 179, 0.3); background: rgba(0,0,0,0.2); color: white; font-size: 0.95rem; }
        button { width: 100%; background: linear-gradient(90deg, #d359b3, #904dd9); border: none; padding: 15px; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; margin-bottom: 15px; font-size: 1rem; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(211, 89, 179, 0.5); }
        .result-box { display: none; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-top: 10px; word-break: break-all; font-size: 0.85rem; border: 1px dashed #a020f0; }
        .result-title { font-size: 0.8rem; color: #ff7eb3; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Link Generator ✨</h2>
        <p class="subtitle">Customize the 6 text lines for the birthday animation</p>
        
        <div class="section-title">Page 2 Text (Camera Scene)</div>
        <label>Line 1 (Top):</label>
        <input type="text" id="l1" value="Here is to your special day...&hellip;" autocomplete="off">
        
        <label>Line 2 (Main Heading):</label>
        <input type="text" id="l2" value="𝐻𝐴𝑃𝑃𝑌 𝐵𝐼𝑅𝑇𝐻𝐷𝐴𝑌" autocomplete="off">
        
        <label>Line 3 (Bottom):</label>
        <input type="text" id="l3" value="Dear, Priya Kumari" autocomplete="off">

        <div class="section-title">Page 3 Text (Final Wish Scene)</div>
        <label>Line 1 (Top):</label>
        <input type="text" id="l4" value="and&hellip;stay my best friend forever..." autocomplete="off">
        
        <label>Line 2 (Main Heading):</label>
        <input type="text" id="l5" value="𝐻𝐴𝑃𝑃𝑌 𝐵𝐼𝑅𝑇𝐻𝐷𝐴𝑌" autocomplete="off">
        
        <label>Line 3 (Bottom):</label>
        <input type="text" id="l6" value="God bless you, Priya Kumari" autocomplete="off">
        
        <button onclick="generateLink()">Generate Link 🔗</button>

        <div id="resultBox" class="result-box">
            <div class="result-title">Copy this link and send to your friend:</div>
            <p id="generatedUrl" style="margin-bottom: 15px; color: #fff;"></p>
            <button onclick="copyLink()" style="padding: 10px; background: #a020f0; margin: 0;">Copy Link 📋</button>
        </div>
    </div>

    <script>
        function generateLink() {
            // Get values from all 6 inputs
            const payload = { 
                l1: document.getElementById('l1').value.trim(), 
                l2: document.getElementById('l2').value.trim(), 
                l3: document.getElementById('l3').value.trim(), 
                l4: document.getElementById('l4').value.trim(), 
                l5: document.getElementById('l5').value.trim(), 
                l6: document.getElementById('l6').value.trim() 
            };
            
            // Encode data (supports emojis and special characters)
            const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
            
            // Generate the link pointing to birthday-animation.html
            let baseUrl = window.location.href.split('?')[0];
            baseUrl = baseUrl.replace('index.html', '');
            if(!baseUrl.endsWith('/')) baseUrl += '/';
            
            const finalLink = `${baseUrl}birthday-animation.html?d=${encodedData}`;
            
            document.getElementById('generatedUrl').innerText = finalLink;
            document.getElementById('resultBox').style.display = 'block';
        }

        function copyLink() {
            const linkText = document.getElementById('generatedUrl').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                alert("Link Copied! Now send it to your friend on WhatsApp.");
            });
        }
    </script>
</body>
</html>
